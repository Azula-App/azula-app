name: Publish

# Builds a v* tag: Android AAB + iOS IPA at the version encoded in the tag, signed
# and validated, both uploaded as workflow artifacts. release.yml cuts and pushes
# the tag; this workflow never invents a version of its own, so re-running it on a
# tag reproduces exactly the same build.
#
# A tag PUSH builds, signs, and validates but does NOT ship -- store uploads (Play,
# TestFlight) run only on a manual workflow_dispatch with dry_run=false. Shipping is
# therefore always a deliberate button-press against an already-built tag, never an
# automatic consequence of a tag existing; pick the Play track on that dispatch.
#
# Note: release.yml pushes tags with the default GITHUB_TOKEN, and GitHub does not
# fire workflow triggers for those, so `on: push` never runs from release.yml. In
# practice you always dispatch this workflow by hand (dry_run first, then to ship).
# The `on: push` trigger only fires for a human/PAT tag push -- build+validate only.
#
# Deliberately runs no tests: ./kotlin check is known-flaky headlessly (see
# azula-docs/openspec/specs/testing/design.md, "Known flakes"), and a flaky gate that fails after one store has
# already been fed is worse than no gate. Tests belong in PR CI.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build (defaults to the latest tag)'
        required: false
        type: string
      dry_run:
        description: 'Build/validate only; do not upload to Play or TestFlight (a tag push is always effectively this)'
        required: false
        default: false
        type: boolean
      track:
        description: 'Google Play track for a manual non-dry release (default production; tag pushes never ship)'
        required: false
        default: production
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve the tag to build
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(git tag --list --sort=-v:refname 'v*' | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "No v* tag to build. Run the Release workflow first." >&2
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || {
            echo "Tag '$TAG' does not exist." >&2
            exit 1
          }
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Derive the version from the tag
        id: version
        run: bash .github/scripts/version_from_tag.sh

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Workload Identity Federation -> Google
    env:
      NEW_VERSION: ${{ needs.version.outputs.version }}
      NEW_VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.tag }} # build the tag, not whatever main is now

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      # The ./kotlin wrapper bootstraps its own JRE, the Amper toolchain, and the
      # resolved dependencies into this directory.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: ${{ runner.os }}-kotlin-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-

      # Runs on every dispatch, including dry runs: the validate act is where the
      # store text should be read, while fixing it is still free. A tag with no
      # CHANGELOG.md (v0.0.1..v0.0.7) warns and continues; a tag that has the file
      # but not this version's section fails. See the script.
      - name: Extract the release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # This job checks out the TAG, so a tag that predates CHANGELOG.md
          # predates this script too -- reading the tooling from the tag is what
          # makes the "no notes, ship anyway" path reachable at all. Guarding
          # inline (rather than in the script) is deliberate: the guard travels
          # with the workflow file, which comes from the dispatched ref, so it
          # exists even when nothing else does. Same trap as the committed
          # ExportOptions.plist -- see specs/release/design.md.
          if [ ! -f .github/scripts/release_notes.sh ]; then
            echo "::warning::This tag predates the release-notes tooling -- shipping $RELEASE_VERSION without notes."
            echo "status=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/release_notes.sh whatsnew/whatsnew-en-US

      - name: Show the release notes in the job summary
        run: |
          {
            echo "### Google Play release notes (en-US)"
            echo ""
            if [ -f whatsnew/whatsnew-en-US ]; then
              echo '```'
              cat whatsnew/whatsnew-en-US
              echo '```'
            else
              echo "_None — this tag predates CHANGELOG.md._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode the upload keystore
        env:
          KEYFILE_BASE64: ${{ secrets.KEYFILE_BASE64 }}
        run: echo "$KEYFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      # Amper reads settings.android.signing.propertiesFile, which is module-relative.
      - name: Write android-app/keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android-app/keystore.properties

      # Signing isn't committed: Amper's signing isn't variant-scoped, so declaring it
      # in module.yaml breaks debug builds for anyone without a keystore. See the script.
      - name: Enable release signing
        run: bash .github/scripts/enable_signing.sh

      - name: Stamp the version into both platforms
        run: bash .github/scripts/set_version.sh

      - name: Build the release AAB
        run: |
          ./kotlin package \
            --module android-app \
            --platform android \
            --variant release \
            --format aab

      # Amper runs AGP inside a generated Gradle project and copies the finished bundle
      # to the top of the task output dir. Only that copy is signed -- the nested
      # gradle-project/**/intermediates/.../intermediary-bundle.aab is not -- so match
      # it exactly (-maxdepth 1) rather than taking the first of a recursive find.
      - name: Locate the AAB
        id: aab
        run: |
          TASK_DIR=build/tasks/_android-app_bundleAndroid
          AAB=$(find "$TASK_DIR" -maxdepth 1 -type f -name '*.aab')
          if [ "$(echo "$AAB" | grep -c .)" -ne 1 ]; then
            echo "Expected exactly one AAB in $TASK_DIR, got:"
            echo "$AAB"
            echo "--- everything under build/ named *.aab:"
            find build -name '*.aab' || true
            exit 1
          fi
          # Refuse to ship an unsigned bundle: Play would reject it, but late and cryptically.
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)$'; then
            echo "$AAB is not signed -- check android-app/keystore.properties and the signing secrets."
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          ls -la "$AAB"

      - name: Upload the AAB as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azula-${{ needs.version.outputs.version }}-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error

      - name: Generate Google Play credentials
        id: auth
        # Store uploads (this + the two below) run ONLY on a manual dispatch that is
        # not a dry run. A tag push therefore builds, signs, validates, and uploads
        # artifacts but never ships -- shipping is always a deliberate workflow_dispatch
        # with dry_run=false. Decouples "a tag exists" from "release it", and removes
        # the auto-ship-on-tag-push hazard (a pushed tag could otherwise ship to Play
        # production before anyone looked at the build).
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      # tracks: chosen by the manual dispatch (default production). It only ever applies
      # here because this step runs solely on a manual non-dry dispatch (see auth step);
      # internal/beta/alpha let you prove the upload path without shipping to users.
      # The action's singular `track` is deprecated (it warns, and will be removed); its
      # replacement `tracks` is a COMMA-SEPARATED string, so a single track passes through
      # unchanged. Never set both -- the action hard-errors if you do.
      - name: Publish to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: app.azula
          releaseFiles: ${{ steps.aab.outputs.path }}
          tracks: ${{ inputs.track || 'production' }}
          status: completed
          releaseName: ${{ needs.version.outputs.version }}
          # The notes ride the same API call as the bundle, so "the binary shipped
          # but its notes didn't" is not a reachable state on Android. Empty when
          # the tag predates CHANGELOG.md, which the action treats as unset.
          whatsNewDirectory: ${{ steps.notes.outputs.status == 'present' && 'whatsnew' || '' }}

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120 # release Kotlin/Native linking for iosArm64 is slow when cold
    env:
      NEW_VERSION: ${{ needs.version.outputs.version }}
      NEW_VERSION_CODE: ${{ needs.version.outputs.version_code }}
      KOTLIN_CLI_NO_WELCOME_BANNER: '1'
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: ${{ runner.os }}-kotlin-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-

      # Both `xcodebuild -allowProvisioningUpdates` and `altool` find the key by
      # convention at ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8.
      - name: Install the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8

      # Same extraction as the Android job, from the same tag, so both platforms
      # publish identical text and a dry run shows what each store would receive.
      - name: Extract the release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Same guard as the Android job: for a tag older than this change, the
          # script isn't in the tree being built. See that job for the reasoning.
          if [ ! -f .github/scripts/release_notes.sh ]; then
            echo "::warning::This tag predates the release-notes tooling -- shipping $RELEASE_VERSION without notes."
            echo "status=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/release_notes.sh "$RUNNER_TEMP/release-notes.txt"

      - name: Show the release notes in the job summary
        run: |
          {
            echo "### TestFlight / App Store notes (en-US)"
            echo ""
            if [ -f "$RUNNER_TEMP/release-notes.txt" ]; then
              echo '```'
              cat "$RUNNER_TEMP/release-notes.txt"
              echo '```'
            else
              echo "_None — this tag predates CHANGELOG.md._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp the version into both platforms
        run: bash .github/scripts/set_version.sh

      # Compile the Kotlin for the device up front so a Kotlin error surfaces in
      # readable Amper logs instead of buried in a several-thousand-line xcodebuild
      # transcript. Deliberately `shared`, not `ios-app`: building the ios-app module
      # runs a full xcodebuild that code-signs, and Amper doesn't pass
      # -allowProvisioningUpdates, so it fails on a fresh runner that has no
      # provisioning profiles yet. The archive step below does pass it.
      - name: Pre-compile the shared Kotlin framework (iosArm64)
        run: ./kotlin build -m shared -p iosArm64

      # Sign + archive + export in ONE step, all MANUAL. The archive MUST be manually
      # signed: xcodebuild -exportArchive silently forces signingStyle=automatic when the
      # archive was automatically signed, ignoring the manual ExportOptions -- and
      # automatic distribution signing needs cloud-managed assets an App Manager ASC key
      # can't mint. One step because keychain/identity state doesn't reliably carry across
      # separate runner steps.
      - name: Sign, archive, and export the IPA
        id: export
        env:
          DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP_B64 }}
          PROFILE_EXT: ${{ secrets.APPLE_PROFILE_EXT_B64 }}
        run: |
          # --- our Apple Distribution cert into a throwaway keychain (no cloud signing:
          #     an App Manager ASC key can't mint a cloud distribution cert) ---
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KPW=$(openssl rand -base64 24)
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security find-identity -v -p codesigning "$KEYCHAIN"
          # --- the two App Store profiles (Xcode 16+ reads UserData/Provisioning Profiles) ---
          PROFDIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          for b64 in "$PROFILE_APP" "$PROFILE_EXT"; do
            tmp=$(mktemp); echo "$b64" | base64 --decode > "$tmp"
            uuid=$(security cms -D -i "$tmp" | plutil -extract UUID raw -)
            cp "$tmp" "$PROFDIR/$uuid.mobileprovision"
            echo "installed '$(security cms -D -i "$tmp" | plutil -extract Name raw -)' -> $uuid"
          done
          # --- name each target's profile in its build settings. xcodebuild takes signing
          #     settings globally on the command line, but the app and extension need
          #     DIFFERENT profiles, so inject each per target (CI-only; not committed, so a
          #     local `./kotlin build` stays automatic). perl, not sed: BSD sed on the
          #     runner won't expand \n in the replacement. The `app.azula;` regex ends in a
          #     semicolon so it can't also match `app.azula.AzulaShare;`. ---
          PBX=ios-app/module.xcodeproj/project.pbxproj
          perl -i -pe 's{PRODUCT_BUNDLE_IDENTIFIER = app\.azula\.AzulaShare;}{$&\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "azula share app store";}g' "$PBX"
          perl -i -pe 's{PRODUCT_BUNDLE_IDENTIFIER = app\.azula;}{$&\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "azula app store";}g' "$PBX"
          # --- archive with MANUAL distribution signing (no -allowProvisioningUpdates, so
          #     it never reaches for cloud signing) ---
          xcodebuild \
            -project ios-app/module.xcodeproj -scheme app -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/azula.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
          # --- synthesize ApplicationProperties (Amper omits it) ---
          # Amper lands the built .app in Products/Applications but leaves the archive's
          # Info.plist without an ApplicationProperties dict. Without it, xcodebuild
          # -exportArchive doesn't recognize a distributable app and rejects every App
          # Store method ("Unknown Distribution Error" / 'expected one {} but found
          # app-store-connect'). Synthesize it from the built app (values read back from
          # the app so they can never drift from what was actually built).
          ARCHIVE="$RUNNER_TEMP/azula.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP" ]; then echo "No .app in the archive"; exit 1; fi
          pb() { /usr/libexec/PlistBuddy -c "$1" "$2"; }
          if ! pb "Print :ApplicationProperties" "$ARCHIVE/Info.plist" >/dev/null 2>&1; then
            pb "Add :ApplicationProperties dict" "$ARCHIVE/Info.plist"
            pb "Add :ApplicationProperties:ApplicationPath string Applications/$(basename "$APP")" "$ARCHIVE/Info.plist"
            pb "Add :ApplicationProperties:CFBundleIdentifier string $(pb 'Print :CFBundleIdentifier' "$APP/Info.plist")" "$ARCHIVE/Info.plist"
            pb "Add :ApplicationProperties:CFBundleShortVersionString string $(pb 'Print :CFBundleShortVersionString' "$APP/Info.plist")" "$ARCHIVE/Info.plist"
            pb "Add :ApplicationProperties:CFBundleVersion string $(pb 'Print :CFBundleVersion' "$APP/Info.plist")" "$ARCHIVE/Info.plist"
            pb "Add :ApplicationProperties:Team string $APPLE_TEAM_ID" "$ARCHIVE/Info.plist"
            echo "Injected ApplicationProperties:"; pb "Print :ApplicationProperties" "$ARCHIVE/Info.plist"
          fi
          # Export with MANUAL signing via -exportArchive, which (unlike a hand-zip)
          # runs xcodebuild's Symbols/ collection for App Store crash symbolication.
          # The ExportOptions is written INLINE here rather than read from
          # .github/ExportOptions.plist: a repo file comes from the built *tag*, not this
          # workflow's ref, so a committed manual plist wouldn't reach the runner --
          # inlining makes it travel with the workflow. (Verified locally that
          # -exportArchive honours signingStyle:manual once the plist is actually present;
          # the earlier "reverts to automatic" was the runner reading the tag's automatic
          # plist.) The heredoc body sits at the run block's indentation so YAML strips it
          # uniformly, leaving valid XML and the PLIST terminator at column 0.
          codesign --verify --deep --strict "$APP" && echo "app signature verified"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict>
          <key>app.azula</key><string>azula app store</string>
          <key>app.azula.AzulaShare</key><string>azula share app store</string>
          </dict>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>destination</key><string>export</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>uploadSymbols</key><true/>
          <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n1)
          [ -n "$IPA" ] || { echo "No IPA exported."; exit 1; }
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          ls -la "$IPA"

      # On failure, dump Xcode's distribution log (the real signing/export error, which
      # the console only summarizes) and upload the archive so it can be re-exported
      # locally without burning another CI run.
      - name: iOS export diagnostics
        if: failure()
        run: |
          echo "=== IDEDistribution logs ==="
          find "$TMPDIR" /var/folders -type d -name '*.xcdistributionlogs' 2>/dev/null | while read -r d; do
            echo "--- $d"
            cat "$d"/*.log 2>/dev/null || true
          done
          echo "=== xcarchive Info.plist ==="
          plutil -p "$RUNNER_TEMP/azula.xcarchive/Info.plist" 2>/dev/null || true

      - name: Upload the xcarchive for debugging
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azula-${{ needs.version.outputs.version }}-xcarchive
          path: ${{ runner.temp }}/azula.xcarchive
          if-no-files-found: warn
          retention-days: 3

      - name: Upload the IPA as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azula-${{ needs.version.outputs.version }}-ipa
          path: ${{ steps.export.outputs.ipa }}
          if-no-files-found: error

      # Keep the archive's dSYMs as an artifact for local crash symbolication (the IPA
      # also carries symbols via uploadSymbols, but a downloadable dSYM is handy).
      - name: Upload dSYMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azula-${{ needs.version.outputs.version }}-dsyms
          path: ${{ runner.temp }}/azula.xcarchive/dSYMs
          if-no-files-found: warn

      # Apple's full acceptance checks (icons, entitlements, duplicate build number)
      # with no TestFlight side effects -- cheap, and it runs on dry runs too.
      - name: Validate the build against App Store Connect
        run: |
          xcrun altool --validate-app \
            -f "${{ steps.export.outputs.ipa }}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        # Same gate as the Play upload: manual non-dry dispatch only, never on a push.
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          xcrun altool --upload-app \
            -f "${{ steps.export.outputs.ipa }}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # altool can set neither TestFlight's "What to Test" nor the App Store's
      # "What's New", so the notes go through the ASC API instead. Skipped for a
      # tag that predates CHANGELOG.md, which has no notes to publish.
      #
      # A venv rather than a bare `pip install`: the runner's python3 is
      # externally managed (PEP 668), so installing into it is not reliable.
      - name: Publish the notes to TestFlight and the App Store
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && steps.notes.outputs.status == 'present' }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          NEW_VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/ascvenv/bin/python" .github/scripts/publish_ios_notes.py \
            --tag "$RELEASE_TAG" \
            --build-number "$NEW_VERSION_CODE" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"

      # The binaries are already on both stores at this point, so a failure here
      # means "shipped without notes", not "did not ship". Say so, and say what
      # fixes it -- the script re-runs standalone and uploads nothing.
      - name: Explain how to recover the notes
        if: ${{ failure() && steps.notes.outcome == 'success' }}
        run: |
          {
            echo "### ⚠️ The build shipped, but its release notes may not have"
            echo ""
            echo "\`publish_ios_notes.py\` is standalone and idempotent. Re-run it against"
            echo "the same tag once App Store Connect has ingested the build:"
            echo ""
            echo '```bash'
            echo "ASC_KEY_ID=... ASC_ISSUER_ID=... python3 .github/scripts/publish_ios_notes.py \\"
            echo "  --tag ${{ needs.version.outputs.tag }} \\"
            echo "  --build-number ${{ needs.version.outputs.version_code }} \\"
            echo "  --notes-file notes.txt"
            echo '```'
            echo ""
            echo "Nothing is re-uploaded and no duplicate build number is risked."
          } >> "$GITHUB_STEP_SUMMARY"
