name: Release

# Cuts a release: bumps the latest v* tag by major/minor/patch and pushes the new
# tag. That push is what triggers publish.yml, which builds and ships Android and
# iOS from the tag. This workflow deliberately does nothing else -- the tag is the
# handoff between "decide the version" and "build that version".

on:
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'Type of version increment (major, minor, patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

# Two concurrent runs would derive the same version from the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the tag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the version is derived from the tags, so we need them all

      - name: Derive the next version from the latest tag
        id: version
        env:
          BUMP_TYPE: ${{ inputs.version_bump_type }}
        run: bash .github/scripts/get_version.sh

      - name: Create and push the release tag
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

      - name: Summary
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          {
            echo "### Released \`$NEW_TAG\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$NEW_VERSION\` |"
            echo "| Android versionCode | \`$NEW_VERSION_CODE\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo ""
            echo "The tag push triggers **Publish**, which builds and ships Android and iOS."
          } >> "$GITHUB_STEP_SUMMARY"
