name: Release

# Cuts a release: bumps the latest v* tag by major/minor/patch, freezes
# CHANGELOG.md's [Unreleased] section as that version, and pushes the promotion
# commit plus the new tag. This workflow decides the version and the release
# notes; the tag is the handoff.
#
# The promotion commit has to land BEFORE the tag, and the tag has to point at
# it: publish.yml reads every repo file from the tag's tree, so notes that are
# not in the tag do not reach either store. That is also what makes a rebuild
# reproducible -- re-running publish.yml on a tag a month later ships
# byte-identical notes, the same way it produces a byte-identical version code.
#
# The cut FAILS if [Unreleased] has no store-notes block, no changelog entries,
# or notes over Google Play's 500-byte limit. Failing here means no tag exists
# yet and nothing has been uploaded; the fix is a commit and a re-dispatch.
#
# It does NOT auto-run publish.yml: a tag pushed by a workflow's GITHUB_TOKEN does not
# trigger other workflows (GitHub's loop-prevention), so publish.yml's `on: push` never
# fires from here. After this runs, dispatch publish.yml manually against the new tag --
# dry_run=true to build + validate, then dry_run=false + a track to ship.

on:
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'Type of version increment (major, minor, patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

# Two concurrent runs would derive the same version from the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the tag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the version is derived from the tags, so we need them all

      - name: Derive the next version from the latest tag
        id: version
        env:
          BUMP_TYPE: ${{ inputs.version_bump_type }}
        run: bash .github/scripts/get_version.sh

      # Validates and freezes the notes. Runs before anything is pushed, so a
      # release with nothing to say never gets as far as a tag.
      - name: Freeze the changelog for this version
        id: notes
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/promote_changelog.sh
          {
            echo "text<<CHANGELOG_EOF"
            NEW_VERSION="$NEW_VERSION" bash -c '
              source .github/scripts/changelog_lib.sh
              changelog_store_notes "$NEW_VERSION"
            '
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Push the promotion commit, then tag it. `git push origin HEAD:main` is
      # deliberately not forced and not rebased: if main moved while this ran, the
      # push is a non-fast-forward and the job fails having created no tag, which
      # is harmless -- re-dispatch. (`concurrency: release` already serializes
      # releases, so the window is seconds.)
      - name: Commit the changelog and push the release tag
        id: tag
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): $NEW_VERSION"
          git push origin HEAD:main
          # HEAD, not $GITHUB_SHA: the commit we just made is the released one,
          # and $GITHUB_SHA now predates the notes.
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG" HEAD
          git push origin "$NEW_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          STORE_NOTES: ${{ steps.notes.outputs.text }}
        run: |
          {
            echo "### Released \`$NEW_TAG\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$NEW_VERSION\` |"
            echo "| Android versionCode | \`$NEW_VERSION_CODE\` |"
            echo "| Commit | \`$RELEASE_SHA\` |"
            echo ""
            echo "**Store notes** — what Play, TestFlight, and the App Store will show:"
            echo ""
            echo '```'
            echo "$STORE_NOTES"
            echo '```'
            echo ""
            echo "Next: dispatch **Publish** against \`$NEW_TAG\` — \`dry_run=true\` to build + validate,"
            echo "then \`dry_run=false\` with a track to ship. (This tag push does not auto-run Publish.)"
          } >> "$GITHUB_STEP_SUMMARY"
