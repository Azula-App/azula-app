# core — the dependency leaf: pure domain value types (Conversation, Attachment,
# TerminalLine, the enums) and the Metro AppScope marker. No Compose, no platform
# code, no a2ui. Everything depends on core; core depends on nothing. (Message
# stays in shared because it embeds an a2ui surface.)
product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, iosX64]

settings:
  kotlin:
    serialization: json
