<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon source. generate.sh bakes the glyphs to paths (browsers don't load
     JetBrains Mono for a favicon) → out/web/favicon.svg. Compact, minimal glow,
     tuned to read at 16-32px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#070709"/>
  <g font-family="JetBrains Mono, monospace" font-weight="700">
    <text x="29" y="42" font-size="26" fill="#52c98a" text-anchor="end">&#x203A;</text>
    <text x="31" y="44" font-size="30" fill="#ff2d9b" text-anchor="start">a</text>
  </g>
</svg>
