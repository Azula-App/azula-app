<?xml version="1.0" encoding="UTF-8"?>
<!-- Android status-bar / notification small icon. Must be a WHITE silhouette on
     transparent — the system tints it (only the alpha channel is used). Same ›a
     mark as the app icon, no glow/background, centred with padding. Rendered by
     generate.sh to res/drawable-*/ic_stat_azula.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <g font-family="JetBrains Mono, monospace" font-weight="700" fill="#ffffff">
    <text x="44.06" y="57.4" font-size="36.75" text-anchor="end">&#x203A;</text>
    <text x="46.88" y="59.25" font-size="40.97" text-anchor="start">a</text>
  </g>
</svg>
