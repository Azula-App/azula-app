appId: app.azula.mock
---
# Android-only: the system Back key should navigate within the app (chat → home),
# not exit it. No iOS equivalent — this is exactly the platform glue Maestro is for.
#
# We connect a fresh peer rather than opening a seeded chat or a terminal: the
# terminal auto-shows the keyboard, so the first Back would only dismiss that, and
# connecting keeps this flow independent of the seed fixtures' names.
- launchApp:
    clearState: true
- assertVisible: "CONVERSATIONS"
- runFlow:
    file: subflows/connect-peer.yaml
    env:
      APP_ID: app.azula.mock
- pressKey: Back
# Still inside azula, back on the home list — not dropped to the launcher.
- assertVisible: "CONVERSATIONS"
