appId: app.azula
---
# System back should navigate within the app (chat → home), not exit it.
# Demo build (seeded personas) via the `demo` intent extra; clean state.
- launchApp:
    clearState: true
    arguments:
      demo: true
- assertVisible: "CONVERSATIONS"
- tapOn:
    text: "tap to ask or play"
- assertVisible: "your llm · always on"
- pressKey: Back
# Still inside azula, back on the home list — not dropped to the launcher.
- assertVisible: "CONVERSATIONS"
- assertVisible: "tap to ask or play"
