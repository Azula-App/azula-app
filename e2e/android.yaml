appId: app.azula
---
# The mock/UI-test build (the `demo` intent extra) injects a FakeTransport — real
# UI, fake network + terminal — so these flows drive the real screens with no live
# peer. On bind, FakeTransport surfaces one inbound terminal conversation; a
# connect dials a chat loopback. clearState avoids saved peers adding rows.
- launchApp:
    clearState: true
    arguments:
      demo: true
- takeScreenshot: e2e/screenshots/android-home
- assertVisible: "azula"
- assertVisible: "CONVERSATIONS"
# The auto-surfaced terminal conversation (named from the fake peer id).
- assertVisible: "mo · onyx · ivy"

# ── Terminal: open it, type a command, see the fake shell echo it ────────────
- tapOn:
    text: "mo · onyx · ivy"
- extendedWaitUntil:
    visible:
      text: "mock shell.*"
    timeout: 5000
- takeScreenshot: e2e/screenshots/android-terminal
- inputText: "ls"
- extendedWaitUntil:
    visible:
      text: ".*ls.*"
    timeout: 5000
- takeScreenshot: e2e/screenshots/android-terminal-typed

# ── Connect a peer: the fake transport loops chat back ───────────────────────
- tapOn:
    text: "‹"
- tapOn:
    text: "+ connect a peer"
- tapOn:
    text: "paste a code…"
- inputText: "azula-mock-peer"
- tapOn:
    text: "connect"
- extendedWaitUntil:
    visible:
      text: ".*linked over iroh.*"
    timeout: 8000
- takeScreenshot: e2e/screenshots/android-connected
