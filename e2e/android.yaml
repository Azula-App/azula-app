appId: app.azula.mock
---
# Android smoke: the packaged `-mock` app launches seeded, its terminal takes a
# keystroke, and a peer connects. The journey itself lives in subflows/ (shared with
# ios.yaml); this file exists to bind it to Android's appId and platform glue.
#
# clearState avoids saved peers adding rows; it does NOT empty the list — the seeds
# are in-memory fixtures, not persisted state.
- launchApp:
    clearState: true
- runFlow:
    file: subflows/home.yaml
    env:
      APP_ID: app.azula.mock
      PLATFORM: android
- runFlow:
    file: subflows/terminal.yaml
    env:
      APP_ID: app.azula.mock
      PLATFORM: android

# ── Connect a peer: the fake transport loops chat back ───────────────────────
# "‹" backs out of the terminal to the home screen first.
- tapOn:
    text: "‹"
- runFlow:
    file: subflows/connect-peer.yaml
    env:
      APP_ID: app.azula.mock
- takeScreenshot: e2e/screenshots/android-connected
