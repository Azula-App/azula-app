appId: ios-app-mock
---
# iOS smoke: the packaged `-mock` app launches seeded and its terminal takes a
# keystroke. The journey itself lives in subflows/ (shared with android.yaml); this
# file exists to bind it to iOS's appId. Connecting a peer is covered on this
# platform by ios-media.yaml, which needs a live chat anyway.
- launchApp
- runFlow:
    file: subflows/home.yaml
    env:
      APP_ID: ios-app-mock
      PLATFORM: ios
- runFlow:
    file: subflows/terminal.yaml
    env:
      APP_ID: ios-app-mock
      PLATFORM: ios
