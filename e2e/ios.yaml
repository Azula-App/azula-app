appId: ios-app
---
# The mock/UI-test build injects a FakeTransport (real UI, fake network + terminal).
# On iOS this requires the app's Swift entry to call ViewController(isDemo = true)
# for the test build. On bind, FakeTransport surfaces one inbound terminal
# conversation; a connect dials a chat loopback.

# ── Home screen ─────────────────────────────────────────────────────────────
- launchApp
- takeScreenshot: e2e/screenshots/ios-home
- assertVisible:
    text: "azula"
- assertVisible:
    text: "CONVERSATIONS"
- assertVisible:
    text: "mo · onyx · ivy"

# ── Terminal: open it, type a command, see the fake shell echo it ────────────
- tapOn:
    text: "mo · onyx · ivy"
- extendedWaitUntil:
    visible:
      text: "mock shell.*"
    timeout: 5000
- takeScreenshot: e2e/screenshots/ios-terminal
- inputText: "ls"
- extendedWaitUntil:
    visible:
      text: ".*ls.*"
    timeout: 5000
- takeScreenshot: e2e/screenshots/ios-terminal-typed
