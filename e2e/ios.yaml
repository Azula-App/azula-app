appId: ios-app-mock
---
# The `-mock` app (ios-app-mock) injects a FakeTransport (real UI, fake network +
# terminal). On bind, FakeTransport surfaces one inbound terminal conversation; a
# connect dials a chat loopback.

# ── Home screen ─────────────────────────────────────────────────────────────
- launchApp
- takeScreenshot: e2e/screenshots/ios-home
- assertVisible:
    text: "azula"
- assertVisible:
    text: "CONVERSATIONS"
- assertVisible:
    text: "mo · onyx · ivy"

# ── Terminal: open it, type a command, see the fake shell echo it ────────────
- tapOn:
    text: "mo · onyx · ivy"
- extendedWaitUntil:
    visible:
      text: "mock shell.*"
    timeout: 5000
- takeScreenshot: e2e/screenshots/ios-terminal
- inputText: "ls"
- extendedWaitUntil:
    visible:
      text: ".*ls.*"
    timeout: 5000
- takeScreenshot: e2e/screenshots/ios-terminal-typed
