# ios-app-mock — the iOS `-mock` build: real UI, fake backend. Mirrors ios-app but
# depends on mock-support and pre-installs a buildMockState() (FakeTransport + no
# persistence) so none of the fake wiring lives in the shipping iOS app.
product:
  type: ios/app

# mock-support -> shared -> network-real transitively pulls iroh-kmp from mavenLocal.
repositories:
  - mavenLocal

dependencies:
  - ../shared
  - ../mock-support

settings:
  compose: enabled
