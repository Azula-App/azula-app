# selfgrant-testapp — a throwaway host for selfgrant-real: one screen that runs
# the on-phone VM permission grant and shows the result. Installs as
# app.azula.selfgrant.test so it never touches the real app's permissions.
product: android/app

dependencies:
  - ../selfgrant-api
  - ../selfgrant-real
  - org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0

settings:
  android:
    minSdk: 34
    targetSdk: 36
    applicationId: app.azula.selfgrant.test
    namespace: app.azula.selfgrant.test
