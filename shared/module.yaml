product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, iosX64]

dependencies:
  - ../a2ui: exported
  - ../core: exported
  - ../link: exported
  - ../markdown: exported
  - ../network-api: exported
  - ../network-real: exported
  - ../notification-api: exported
  - ../persistence-api: exported
  - ../persistence-real: exported
  - ../sync-api: exported
  - ../sync-real: exported
  - ../terminal-api: exported
  - ../terminal-real: exported
  - ../theme: exported
  - ../ui-common: exported
  - $compose.foundation: exported
  - $compose.material3: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0: exported
  # Metro DI — runtime annotations (the compiler plugin is applied under settings.kotlin
  # below). Pinned to the 0.13.x line, which supports this project's Kotlin 2.3.21.
  - dev.zacsweers.metro:runtime:0.13.2: exported

dependencies@android:
  - androidx.activity:activity-compose:1.7.2  # for the system BackHandler
  # Credential Manager — the real "save to password manager" sheet for the
  # onboarding back-up step (PhraseSaver.android.kt). The play-services-auth
  # artifact is what routes the request to a provider on API < 34; without it
  # older devices report no provider and fall back to the clipboard.
  - androidx.credentials:credentials:1.3.0
  - androidx.credentials:credentials-play-services-auth:1.3.0

test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0

settings:
  compose:
    enabled: true
  kotlin:
    serialization: json
    compilerPlugins:
      - id: dev.zacsweers.metro.compiler
        dependency: dev.zacsweers.metro:compiler:0.13.2
