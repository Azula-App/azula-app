product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, iosX64]

# iroh-kmp (a mavenLocal artifact) is now an implementation detail of network-real;
# keep the repo so it resolves transitively at runtime.
repositories:
  - mavenLocal

dependencies:
  - ../core: exported
  - ../network-api: exported
  - ../network-real: exported
  - ../terminal-api: exported
  - ../terminal-real: exported
  - ../theme: exported
  - $compose.foundation: exported
  - $compose.material3: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0: exported
  # Metro DI — runtime annotations (the compiler plugin is applied under settings.kotlin
  # below). Pinned to the 0.13.x line, which supports this project's Kotlin 2.3.21.
  - dev.zacsweers.metro:runtime:0.13.2: exported

dependencies@android:
  - androidx.activity:activity-compose:1.7.2  # for the system BackHandler

test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0

settings:
  compose:
    enabled: true
  kotlin:
    serialization: json
    compilerPlugins:
      - id: dev.zacsweers.metro.compiler
        dependency: dev.zacsweers.metro:compiler:0.13.2
