# terminal-api — the dependency-free terminal engine: the VT-100 screen model
# (TerminalEmulator/Row), speculative local echo (PredictionEngine), key-to-bytes
# encoding (TermSeq/keyEventToBytes), and the TerminalSession contract. Pure
# logic over Compose snapshot state + key events; no app dependencies, so it's
# unit-testable in isolation (see TerminalEmulatorTest). The terminal UI + the
# real session implementations live in terminal-real.
product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, iosX64]

dependencies:
  - ../core: exported
  - $compose.runtime: exported
  - $compose.ui: exported

settings:
  compose:
    enabled: true
